metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
use_local_tz = true

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# rpc_secret comes from GARAGE_RPC_SECRET

[s3_api]
# Not "garage". Caluma 11.3 cannot set a region. See garage_migration.md.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
# admin_token and metrics_token come from GARAGE_ADMIN_TOKEN / GARAGE_METRICS_TOKEN
